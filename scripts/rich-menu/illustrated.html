<!doctype html>
<!-- Rich menu built on the illustrated design (illustrated-base.png, the supplied
     artwork cropped above its mock chat bar). The right-hand large tile is
     redrawn here as Fridge AI in the artwork's own colours. Render at 1536x893
     and pair the output with illustrated.json. -->
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=block" rel="stylesheet">
<style>
  :root {
    --tile: #cdebfe;
    --circle: #fcfdfe;
    --title: #00224c;
    --body: #3a4d75;
    --stroke: #104386;
    --chevron: #183c75;
    --fill: #d6ebfc;
    --spark: #6f86f2;
  }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1536px; height: 893px; position: relative; overflow: hidden; font-family: "Kanit", sans-serif; }
  .base { position: absolute; inset: 0; width: 1536px; height: 893px; }
  .tile { position: absolute; left: 790px; top: 389px; width: 714px; height: 234px; background: var(--tile); border-radius: 16px; display: flex; align-items: center; }
  .circle { position: absolute; left: 32px; top: 39px; width: 156px; height: 156px; border-radius: 50%; background: var(--circle); display: flex; align-items: center; justify-content: center; }
  .circle svg { width: 116px; height: 116px; }
  .text { position: absolute; left: 230px; top: 34px; }
  .text h2 { font-size: 54px; font-weight: 600; color: var(--title); line-height: 1.15; letter-spacing: -0.005em; }
  .text p { font-size: 30px; font-weight: 400; color: var(--body); line-height: 1.5; margin-top: 10px; }
  .chevron { position: absolute; right: 26px; top: 96px; width: 40px; height: 44px; }
</style></head>
<body>
  <img class="base" src="illustrated-base.png" alt="">
  <div class="tile">
    <div class="circle">
      <svg viewBox="0 0 48 48" fill="none" stroke="var(--stroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 4h18a4 4 0 0 1 4 4v10H11V8a4 4 0 0 1 4-4z" fill="var(--fill)" stroke="none" />
        <rect x="11" y="4" width="26" height="40" rx="5" />
        <path d="M11 18h26" />
        <path d="M17 9.5v3.5" />
        <path d="M17 24v7" />
        <path d="M41 30.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="var(--spark)" stroke="var(--spark)" stroke-width="1.6" />
      </svg>
    </div>
    <div class="text">
      <h2>ตู้เย็น AI</h2>
      <p>ถ่ายรูปของในตู้เย็น<br>ให้ AI คิดเมนูจากของที่มี</p>
    </div>
    <svg class="chevron" viewBox="0 0 20 22" fill="none" stroke="var(--chevron)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l8 8-8 8" /></svg>
  </div>
</body></html>
